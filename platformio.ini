; Heltec WiFi LoRa 32 V4-R8 (HTIT-WBR8H): ESP32-S3R8 (8MB octal PSRAM), 16MB QIO flash, SX1262 + KCT8103L FEM.
; Build:  pio run              (both nodes)
; Flash:  pio run -e local -t upload   /   pio run -e remote -t upload
; Serial: pio device monitor   (native USB CDC; there is no USB-UART bridge on this board)

[platformio]
src_dir = src
default_envs = local, remote

; Project options. Both nodes read these, so reflash both boards after changing them.
[loracamera]
; Microphone capture on the remote node, alternating with pictures (5 s ≈ 110 KB per clip).
; 0 = pictures only (default), 1 = build both nodes with audio support.
audio = 0

[env]
platform = platformio/espressif32 @ ^7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLORACAMERA_AUDIO=${loracamera.audio}
lib_deps =
	jgromes/RadioLib @ ^7.8.1

[env:local]
build_src_filter = +<local/>
lib_deps =
	${env.lib_deps}
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.6.2

[env:remote]
build_src_filter = +<remote/>
