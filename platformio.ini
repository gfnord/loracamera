; Boards (one environment per node and board; mix them freely, the radios talk to each other):
;   local,    remote     Heltec WiFi LoRa 32 V4-R8: ESP32-S3R8, 8MB PSRAM, 16MB flash, SX1262 + KCT8103L FEM
;   local_v2, remote_v2  Heltec WiFi LoRa 32 V2:    ESP32, no PSRAM, 8MB flash, SX1276
; Build:  pio run              (V4-R8 nodes; add -e local_v2 -e remote_v2 for the V2)
; Flash:  pio run -e local -t upload   /   pio run -e remote_v2 -t upload   ...
; Serial: pio device monitor   (V4-R8: native USB CDC; V2: CP2102 USB-UART)

[platformio]
src_dir = src
default_envs = local, remote

; Project options. The base station always listens and the remote starts every transfer, so
; `audio`, `motion`, `poll_interval` and the camera/test options only change the remote: reflash the remote.
[loracamera]
; Microphone capture on the remote node, alternating with pictures (5 s ≈ 110 KB per clip).
; 0 = pictures only (default), 1 = remote records audio on every other wake-up. Needs motion = 0.
audio = 0
; What wakes the remote node to take and send a picture (it deep-sleeps in between).
; 1 = its PIR motion sensor (wiring in docs/hardware.md): pictures only when something moves (default).
; 0 = no PIR: a timer, every `poll_interval` seconds, plus one picture right after power-on.
motion = 1
; motion = 0 only: seconds the remote sleeps between pictures, 1-86400 (600 = every 10 minutes).
; Each picture costs the remote ~2-4 mAh: see the battery sizing in docs/hardware.md.
poll_interval = 3600
; 0.96" OLED status screen on both nodes (setup, picture, transfer progress and RSSI, results).
; 0 = no display (status on the serial log only), 1 = draw status on the OLED.
; `display` is for the V4-R8, which is sold with or without the OLED (default 0);
; `display_v2` is for the Heltec V2, which always has one (default 1).
display = 0
display_v2 = 1
; microSD card on the local node (base station): every received file is saved there before uploading.
; 1 = SD breakout fitted (wiring in docs/hardware.md), 0 = upload only.
sdcard = 0
; VC0706 camera (remote node only).
; Serial speed after the camera starts: 38400 (its power-up default) or 115200 (its maximum).
camera_baud = 115200
; Remote node only. 1 = don't use the camera: send a built-in 22704-byte 640x480 test JPEG
; (src/remote/test_image.h) instead, to test the link, SD card and upload without a camera.
; 0 = camera pictures (default).
test_image = 0
; JPEG compression register, 0-255. Camera default is 54 (0x36); higher = smaller, blockier JPEGs.
; With jpeg_quality > 0 the image is re-encoded anyway, so keep this low for a clean source.
camera_compression = 54
; Re-encode the camera JPEG on the remote node before sending (fewer LoRa packets).
; 0 = send the camera JPEG unchanged; 1-100 = JPEG quality of the re-encoded image (lower = smaller).
jpeg_quality = 30
; 1 = send near-colourless images (IR night shots) as grayscale JPEGs; 0 = always colour.
; Needs jpeg_quality > 0.
night_grayscale = 1
; Mean colourfulness (0-255) at or below which an image counts as a night shot.
; Every picture logs its value as "chroma" on the remote node: tune from that.
night_max_chroma = 12

[env]
platform = platformio/espressif32 @ ^7.1.3
framework = arduino
monitor_speed = 115200
build_flags =
	-DLORACAMERA_AUDIO=${loracamera.audio}
	-DLORACAMERA_MOTION=${loracamera.motion}
	-DLORACAMERA_POLL_INTERVAL=${loracamera.poll_interval}
	-DLORACAMERA_SDCARD=${loracamera.sdcard}
	-DLORACAMERA_CAMERA_BAUD=${loracamera.camera_baud}
	-DLORACAMERA_CAMERA_COMPRESSION=${loracamera.camera_compression}
	-DLORACAMERA_TEST_IMAGE=${loracamera.test_image}
	-DLORACAMERA_JPEG_QUALITY=${loracamera.jpeg_quality}
	-DLORACAMERA_NIGHT_GRAYSCALE=${loracamera.night_grayscale}
	-DLORACAMERA_NIGHT_MAX_CHROMA=${loracamera.night_max_chroma}
lib_deps =
	jgromes/RadioLib @ ^7.8.1
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.6.2

; Heltec WiFi LoRa 32 V4-R8 (HTIT-WBR8H): ESP32-S3R8 (8MB octal PSRAM), 16MB QIO flash, SX1262 + KCT8103L FEM.
[heltec_v4r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
	${env.build_flags}
	-DLORACAMERA_BOARD_HELTEC_V4R8
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLORACAMERA_DISPLAY=${loracamera.display}

; Heltec WiFi LoRa 32 V2: ESP32-D0WDQ6 (no PSRAM), 8MB flash, SX1276. No PSRAM, so the
; remote node sends the camera JPEG unchanged (jpeg_quality and night_grayscale are ignored).
[heltec_v2]
board = heltec_wifi_lora_32_V2
build_flags =
	${env.build_flags}
	-DLORACAMERA_BOARD_HELTEC_V2
	-DLORACAMERA_DISPLAY=${loracamera.display_v2}

[node_local]
build_src_filter = +<local/>

[node_remote]
build_src_filter = +<remote/>

[env:local]
extends = heltec_v4r8, node_local

[env:remote]
extends = heltec_v4r8, node_remote

[env:local_v2]
extends = heltec_v2, node_local

[env:remote_v2]
extends = heltec_v2, node_remote
